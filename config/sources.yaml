defaults:
  start_date: "2024-01-01"
  end_date: "2024-03-31"
  bronze_lakehouse: lh_bronze
  raw_root: Files/raw

sources:

  - name: taxi
    enabled: true
    loader: pl_ingest_taxi
    format: parquet
    url: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{month}.parquet
    target: Files/raw/taxi
    schedule: daily (via pl_master)
    owner: data-engineering

  - name: taxi_zones
    enabled: true
    loader: pl_ingest_taxi
    format: csv + shapefile (zip)
    url: https://d37ci6vzurychx.cloudfront.net/misc/
    target: Files/raw/taxi_zones

  - name: openaq
    enabled: true
    loader: nb_bronze_openaq
    format: json_records
    url: https://api.openaq.org/v3
    bbox: "-74.26,40.49,-73.70,40.92"
    parameters: [pm25, no2]
    target: dbo.bronze_openaq, dbo.bronze_openaq_sensors
    secret: OpenAQ API key (never committed to Git)

  - name: gdp
    enabled: true
    loader: df_ingest_macro
    format: json_records
    url: https://api.worldbank.org/v2/country/{countries}/indicator/NY.GDP.MKTP.CD?format=json
    target: dbo.bronze_gdp

  - name: fx
    enabled: true
    loader: df_ingest_macro
    format: csv
    url: https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?format=csvdata&startPeriod=2015-01-01
    target: dbo.bronze_fx

  - name: weather
    enabled: true
    loader: generic
    format: json_columns
    record_path: daily
    url: >-
      https://archive-api.open-meteo.com/v1/archive?latitude=40.7128&longitude=-74.0060&start_date={start_date}&end_date={end_date}&daily=temperature_2m_mean,precipitation_sum,wind_speed_10m_max&timezone=America%2FNew_York
    target_table: bronze_weather
    write_mode: overwrite
    owner: data-engineering
